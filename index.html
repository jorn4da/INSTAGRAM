<script>
(function(){
  // Repassa UTMs da bio (ou marca origem instagram/bio) para os sites de destino
  var q=new URLSearchParams(location.search);
  var utm={utm_source:q.get('utm_source')||'instagram',utm_medium:q.get('utm_medium')||'bio',utm_campaign:q.get('utm_campaign')||'linktree_aritan'};
  ['utm_content','utm_term','fbclid','gclid'].forEach(function(k){if(q.get(k))utm[k]=q.get(k);});
  document.querySelectorAll('.link').forEach(function(a){
    try{var u=new URL(a.href);for(var k in utm){if(!u.searchParams.has(k))u.searchParams.set(k,utm[k]);}a.dataset.clean=a.href;a.href=u.toString();}catch(e){}
  });

  function track(name,url){
    try{gtag('event','click_link',{link_name:name,link_url:url,transport_type:'beacon'});}catch(e){}
    try{
      if(name==='whatsapp')fbq('track','Contact');
      else if(name==='vaga')fbq('trackCustom','CliqueVaga');
      else fbq('trackCustom','CliqueLink',{link:name});
    }catch(e){}
  }
  document.querySelectorAll('[data-ev]').forEach(function(a){
    a.addEventListener('click',function(){track(a.dataset.ev,a.href);});
  });

  // Botao de tres pontos: compartilhar ou copiar o link
  var toast=document.getElementById('toast');
  document.querySelectorAll('.more').forEach(function(b){
    b.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      var a=b.closest('.link'),url=a.dataset.clean||a.href,title=a.querySelector('.label').textContent;
      if(navigator.share){navigator.share({title:title,url:url}).catch(function(){});}
      else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast.classList.add('on');setTimeout(function(){toast.classList.remove('on');},1600);});}
    });
  });
})();
</script>
